name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The engine must build and pass its tests on all three desktop platforms and
  # on both major compilers. Warnings are errors here: the project has none, and
  # keeping it that way is cheaper than cleaning them up later.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux / GCC",      os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: "Linux / Clang",    os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: "macOS / AppleClang", os: macos-latest, cc: clang, cxx: clang++ }
          - { name: "Windows / MSVC",   os: windows-latest, cc: "",    cxx: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DNAV_WARNINGS_AS_ERRORS=ON
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Play twenty full runs headless
        shell: bash
        run: |
          # The smoke test drives generation, combat, items, spells, stairs and
          # the serialiser end to end. It fails if any run wedges or if a save
          # does not round-trip.
          if [ -f build/nav ]; then ./build/nav --demo 20;
          else ./build/Release/nav.exe --demo 20; fi

      - name: Walk the whole dungeon
        shell: bash
        run: |
          # A different question from the demo. The demo asks where the curve
          # kills people; this asks whether the sixteenth floor can be reached
          # at all and whether every guardian dies when it should. It fails if
          # any run stops short — which is how four separate defects that made
          # the second half of the game unreachable were found.
          if [ -f build/nav ]; then ./build/nav --sweep 4;
          else ./build/Release/nav.exe --sweep 4; fi

  # ---------------------------------------------------------------------------
  # Undefined behaviour and memory errors are silent on a release build; this
  # job is what makes them loud.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san --parallel
      - name: Run unit tests
        run: ctest --test-dir build-san --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1
      - name: Run headless games
        run: ./build-san/nav --demo 6

  # ---------------------------------------------------------------------------
  # Line coverage of the engine. The report is uploaded as an artifact and the
  # headline number is printed into the job summary.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: sudo apt-get update -qq && sudo apt-get install -y lcov
      - name: Configure
        run: cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DNAV_COVERAGE=ON
      - name: Build
        run: cmake --build build-cov --parallel
      - name: Run tests
        run: ctest --test-dir build-cov --output-on-failure
      - name: Collect
        run: |
          lcov --directory build-cov --capture --output-file coverage.info \
               --ignore-errors mismatch,gcov,source
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' '*/frontend/*' \
               --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info | tee coverage.txt
          {
            echo "### Engine line coverage"
            echo '```'
            tail -n 3 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.info
            coverage.txt

  # ---------------------------------------------------------------------------
  # The pixel art is authored as text and generated into frontend/web/sprites.js.
  # A generated file that is committed can drift from its source, and the drift
  # is invisible until someone notices the wrong picture, so the build regenerates
  # it and fails if the result differs from what is checked in.
  # ---------------------------------------------------------------------------
  art:
    name: Sprites are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Regenerate
        run: python3 tools/sprites/build.py
      - name: Fail if the checked-in artwork is stale
        run: |
          git diff --exit-code -- frontend/web/sprites.js docs/media/sprites.png \
            || { echo "::error::run tools/sprites/build.py and commit the result"; exit 1; }

  # ---------------------------------------------------------------------------
  # The engine is compiled with -Wall -Wextra -Wpedantic -Wshadow -Werror on four
  # toolchains. The browser frontend is seventeen hundred lines that nothing
  # checked at all, where a misspelt identifier reaches players as a blank
  # screen. This is that check.
  #
  # eslint is pulled on demand and pinned, so the repository carries no
  # package.json and no node_modules: a C++ project should not have to maintain
  # a JavaScript toolchain to get its JavaScript looked at.
  # ---------------------------------------------------------------------------
  lint-js:
    name: Browser frontend lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ESLint
        run: npx --yes eslint@9.39.5 .

  # ---------------------------------------------------------------------------
  # The browser build. This job only proves the WebAssembly target compiles and
  # loads; publishing lives in pages.yml.
  # ---------------------------------------------------------------------------
  web:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache
      - name: Verify the toolchain
        run: emcc --version
      - name: Build
        run: |
          emcmake cmake -S . -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAV_BUILD_TESTS=OFF \
            -DNAV_BUILD_TERMINAL=OFF
          cmake --build build-web --parallel
      - name: Load the module and play a few turns under Node
        run: |
          node -e "
            const Mod = require('./build-web/nav.js');
            Mod().then(m => {
              m.ccall('nav_new_game', null, ['string','number','number'], ['ci', 0, 1234]);
              const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
              for (let i = 0; i < 200; i++) {
                const d = dirs[i % 4];
                m._nav_perform(1, d[0], d[1], -1, -1, -1);
              }
              const p = m._nav_state_json();
              const s = JSON.parse(m.UTF8ToString(p));
              m._nav_free_cstr(p);
              if (!s.map || s.map.glyphs.length !== s.w * s.h) throw new Error('bad map payload');
              const sp = m._nav_save();
              const blob = m.UTF8ToString(sp);
              m._nav_free_cstr(sp);
              if (m.ccall('nav_load','number',['string'],[blob]) !== 1) throw new Error('reload failed');
              console.log('wasm ok: turn ' + s.turn + ', save ' + blob.length + ' bytes');
            }).catch(e => { console.error(e); process.exit(1); });
          "
      # Packaged exactly the way pages.yml packages it. Publishing folds the
      # generated art and music into the page, and that fold is a script with
      # its own way to fail; building the artifact any other way here would
      # leave the only path that ever reaches players untested.
      - name: Package
        run: |
          python3 tools/inline_sprites.py dist
          cp build-web/nav.js dist/
          touch dist/.nojekyll
      - name: The published page carries its own art
        run: |
          for name in app.js sprites.js music.js; do
            if grep -q "script src=\"$name\"" dist/index.html; then
              echo "::error::$name was not inlined into dist/index.html"; exit 1
            fi
            if [ -f "dist/$name" ]; then
              echo "::error::dist/$name should not be published separately"; exit 1
            fi
          done
          if grep -q 'stylesheet" href="app.css"' dist/index.html; then
            echo "::error::app.css was not inlined into dist/index.html"; exit 1
          fi
          [ -f dist/app.css ] && { echo "::error::dist/app.css should not be published"; exit 1; }
          echo "ok: dist/index.html is self-contained"
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist
