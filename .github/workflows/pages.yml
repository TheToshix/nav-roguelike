name: Deploy to GitHub Pages

# Publishes the browser build so the game can be played from the README link.
# Enable this once, under Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    # Both names: see the note in ci.yml. Publishing that quietly never fires is
    # worse than publishing that fails loudly.
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Build the WebAssembly target
        run: |
          emcmake cmake -S . -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAV_BUILD_TESTS=OFF \
            -DNAV_BUILD_TERMINAL=OFF
          cmake --build build-web --parallel

      - name: Package
        run: |
          python3 tools/inline_sprites.py dist
          cp build-web/nav.js dist/
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
